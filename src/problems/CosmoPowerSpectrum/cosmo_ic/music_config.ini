[setup]
boxlength = 67.5        # 100 Mpc/h
zstart = 99.0           # CAMB z_start
levelmin = 7            # 128 resolution
levelmin_TF = 7
levelmax = 7
region = box
align_top = yes
blocking_factor = 32
baryons = yes
use_2LPT = no          # Zel'dovich linear approx for z=99
use_LLA = no
periodic_TF = yes      # periodic boundary condition for the Fourier transform

[cosmology]
Omega_m			= 0.316049
Omega_L			= 0.683951      # flat universe (1.0 - Omega_m)
w_0			    = -1.0
w_a			    = 0.0
Omega_b			= 0.048285       # ombh2 / h^2
H0			    = 67.5           # Hubble constant (now)  km/s/Mpc
sigma_8			= 0.811
n_s			    = 0.965
gamma           = 1.66666667     # 5/3
transfer		= camb_file
transfer_file   = ./CAMB_lcdm_transfer_z99.0.dat


[random]
seed[7]			= 34567


[output]
format   = nyx
filename = cosmo_ps_ic_quokka


